apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectxray-worker
  namespace: projectxray-system
  labels:
    app.kubernetes.io/name: projectxray-worker
    app.kubernetes.io/component: evaluation-worker
    app.kubernetes.io/part-of: projectxray-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: projectxray-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projectxray-worker
        app.kubernetes.io/component: evaluation-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3002"
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: evaluation-worker
          image: projectxray-ai:latest
          command: ["node", "dist/backend/src/worker.js"]
          env:
            - name: APP_ROLE
              value: "worker"
          envFrom:
            - configMapRef:
                name: projectxray-config
            - secretRef:
                name: projectxray-secrets
          ports:
            - name: http-metrics
              containerPort: 3002
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

