apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: projectxray-system
  labels:
    app.kubernetes.io/name: redis-service
    app.kubernetes.io/component: queue-broker
    app.kubernetes.io/part-of: projectxray-ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-broker
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

