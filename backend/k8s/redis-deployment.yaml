apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-broker
  namespace: projectxray-system
  labels:
    app.kubernetes.io/name: redis-broker
    app.kubernetes.io/component: queue-broker
    app.kubernetes.io/part-of: projectxray-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-broker
        app.kubernetes.io/component: queue-broker
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "512mb"
            - "--maxmemory-policy"
            - "noeviction"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}

