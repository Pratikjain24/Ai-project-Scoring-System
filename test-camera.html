<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Test - ProjectX-Ray AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e2e8f0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .alert-info { background: #0c4a6e; border-left: 4px solid #0ea5e9; }
    .alert-success { background: #064e3b; border-left: 4px solid #10b981; }
    .alert-error { background: #7f1d1d; border-left: 4px solid #ef4444; }
    .alert-warning { background: #713f12; border-left: 4px solid #f59e0b; }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    
    .card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
    }
    
    .video-container {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    button {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 5px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(6, 182, 212, 0.3);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }
    .info-label { color: #94a3b8; }
    .info-value {
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }
    .status-ok { color: #10b981; }
    .status-error { color: #ef4444; }
    
    #console {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 1rem;
    }
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #1e293b;
    }
    .log-time { color: #64748b; }
    .log-success { color: #10b981; }
    .log-error { color: #ef4444; }
    .log-info { color: #06b6d4; }
    .log-warn { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📹 Camera Diagnostic Tool</h1>
    <div class="alert alert-info">
      <strong>Purpose:</strong> Test camera access before running the full Live Jury feature. 
      This standalone page helps diagnose WebRTC camera issues.
    </div>

    <div id="urlCheck"></div>
    <div id="apiCheck"></div>

    <div class="grid">
      <!-- Video Feed -->
      <div class="card">
        <h2 style="margin-bottom: 1rem;">Live Camera Feed</h2>
        <div class="video-container">
          <video id="video" autoplay playsinline muted></video>
        </div>
        <div style="margin-top: 1rem; text-align: center;">
          <button id="startBtn" onclick="startCamera()">🎥 Start Camera</button>
          <button id="stopBtn" onclick="stopCamera()" class="stop" disabled>⏹️ Stop Camera</button>
        </div>
      </div>

      <!-- System Info -->
      <div class="card">
        <h2 style="margin-bottom: 1rem;">System Information</h2>
        <div class="info-item">
          <span class="info-label">Browser:</span>
          <span class="info-value" id="browser"></span>
        </div>
        <div class="info-item">
          <span class="info-label">Platform:</span>
          <span class="info-value" id="platform"></span>
        </div>
        <div class="info-item">
          <span class="info-label">getUserMedia:</span>
          <span class="info-value" id="apiStatus"></span>
        </div>
        <div class="info-item">
          <span class="info-label">Current URL:</span>
          <span class="info-value" id="currentUrl"></span>
        </div>
        <div class="info-item">
          <span class="info-label">Protocol:</span>
          <span class="info-value" id="protocol"></span>
        </div>
        <div class="info-item">
          <span class="info-label">Camera Status:</span>
          <span class="info-value" id="cameraStatus">Not started</span>
        </div>
      </div>
    </div>

    <!-- Console Log -->
    <div class="card">
      <h2 style="margin-bottom: 1rem;">Console Log</h2>
      <div id="console"></div>
    </div>
  </div>

  <script>
    let stream = null;

    function log(message, type = 'info') {
      const console = document.getElementById('console');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
      console.appendChild(entry);
      console.scrollTop = console.scrollHeight;
      
      // Also log to browser console
      console.log(`[CameraTest] ${message}`);
    }

    function updateStatus(status, isOk = true) {
      const el = document.getElementById('cameraStatus');
      el.textContent = status;
      el.className = isOk ? 'info-value status-ok' : 'info-value status-error';
    }

    // Check system capabilities
    function checkSystem() {
      // Browser info
      const ua = navigator.userAgent;
      let browserName = 'Unknown';
      if (ua.includes('Chrome')) browserName = 'Chrome';
      else if (ua.includes('Firefox')) browserName = 'Firefox';
      else if (ua.includes('Safari')) browserName = 'Safari';
      else if (ua.includes('Edge')) browserName = 'Edge';
      
      document.getElementById('browser').textContent = browserName;
      document.getElementById('platform').textContent = navigator.platform;
      document.getElementById('currentUrl').textContent = window.location.href;
      document.getElementById('protocol').textContent = window.location.protocol;

      // Check getUserMedia API
      const hasApi = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
      const apiEl = document.getElementById('apiStatus');
      apiEl.textContent = hasApi ? '✅ Supported' : '❌ Not Available';
      apiEl.className = hasApi ? 'info-value status-ok' : 'info-value status-error';
      
      const apiCheck = document.getElementById('apiCheck');
      if (!hasApi) {
        apiCheck.innerHTML = `
          <div class="alert alert-error">
            <strong>⚠️ getUserMedia API not available!</strong><br>
            Your browser doesn't support camera access or it's disabled.
          </div>
        `;
        log('getUserMedia API not available', 'error');
      } else {
        apiCheck.innerHTML = `
          <div class="alert alert-success">
            <strong>✅ getUserMedia API is available</strong><br>
            Your browser supports camera access.
          </div>
        `;
        log('getUserMedia API is available', 'success');
      }

      // Check URL protocol
      const urlCheck = document.getElementById('urlCheck');
      const protocol = window.location.protocol;
      const hostname = window.location.hostname;
      
      if (protocol === 'https:' || hostname === 'localhost' || hostname === '127.0.0.1') {
        urlCheck.innerHTML = `
          <div class="alert alert-success">
            <strong>✅ Secure Context Detected</strong><br>
            Camera access is allowed on this URL (${protocol}//${hostname}).
          </div>
        `;
        log(`Secure context: ${protocol}//${hostname}`, 'success');
      } else {
        urlCheck.innerHTML = `
          <div class="alert alert-error">
            <strong>⚠️ Insecure Context!</strong><br>
            Camera access requires HTTPS or localhost. Current: ${protocol}//${hostname}<br>
            <strong>Solution:</strong> Access via http://localhost or https://${hostname}
          </div>
        `;
        log(`Insecure context: ${protocol}//${hostname}`, 'error');
      }
    }

    async function startCamera() {
      log('Requesting camera access...', 'info');
      updateStatus('Requesting permission...', true);
      
      const video = document.getElementById('video');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('getUserMedia API not available');
        }

        log('Calling getUserMedia with constraints: 1280x720', 'info');
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        log('✅ Camera stream obtained successfully!', 'success');
        video.srcObject = stream;
        
        await video.play();
        log('✅ Video playback started', 'success');
        
        updateStatus('✅ Camera Active', true);
        startBtn.disabled = true;
        stopBtn.disabled = false;

        // Log track info
        const videoTrack = stream.getVideoTracks()[0];
        const settings = videoTrack.getSettings();
        log(`Camera: ${videoTrack.label}`, 'info');
        log(`Resolution: ${settings.width}x${settings.height} @ ${settings.frameRate}fps`, 'info');

      } catch (error) {
        log(`❌ Camera access failed: ${error.message}`, 'error');
        updateStatus('❌ Camera Failed', false);
        
        if (error instanceof DOMException) {
          let helpText = '';
          switch (error.name) {
            case 'NotAllowedError':
              helpText = 'Camera permission denied. Click the 🔒 icon in address bar and allow camera.';
              break;
            case 'NotFoundError':
              helpText = 'No camera found. Please connect a webcam.';
              break;
            case 'NotReadableError':
              helpText = 'Camera is in use by another application.';
              break;
            case 'NotSupportedError':
              helpText = 'Camera requires HTTPS or localhost.';
              break;
            default:
              helpText = `Error: ${error.name}`;
          }
          log(helpText, 'error');
          alert(helpText);
        }
      }
    }

    function stopCamera() {
      if (stream) {
        log('Stopping camera...', 'info');
        stream.getTracks().forEach(track => {
          track.stop();
          log(`Stopped track: ${track.label}`, 'info');
        });
        stream = null;
        
        const video = document.getElementById('video');
        video.srcObject = null;
        
        updateStatus('Camera Stopped', true);
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        
        log('✅ Camera stopped successfully', 'success');
      }
    }

    // Initialize
    window.addEventListener('load', () => {
      checkSystem();
      log('Camera diagnostic tool initialized', 'info');
      log('Click "Start Camera" to test camera access', 'info');
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      stopCamera();
    });
  </script>
</body>
</html>
